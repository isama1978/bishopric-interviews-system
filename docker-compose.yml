name: bishopric-interviews

services:
  db:
    image: postgres:17.12
    container_name: bishopric-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
